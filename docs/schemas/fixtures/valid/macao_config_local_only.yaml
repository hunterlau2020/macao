version: "2.5"
project:
  name: "stockdb-local"
  repository:
    workspace_path: "."
    remote_name: null
    default_branch: "main"

team:
  name: "stockdb-local"
  executor:
    id: "stockdb-dev"
    cli: "opencode"
    adapter: "pty-wrapper"
  reviewers:
    - id: "stockdb-arch"
      cli: "claude-code"
      adapter: "pty-wrapper"
      vote_weight: 1
    - id: "stockdb-sec"
      cli: "codex"
      adapter: "pty-wrapper"
      vote_weight: 1

policy:
  consensus_rule: "weighted_2/3_v1"
  dictator_cap_enabled: true
  minimum_winning_seats: 2
  seat_quorum_required: 2
  weight_quorum_required: 2
  max_rework_rounds: 3
  review_strategy: "delta_plus_focus"

merge:
  strategy: "ff_only"
  ci_gate_command: null
  require_human_signoff: false
  rebase_before_merge: false
