version: "2.5"
project:
  name: "macao-project"
  repository:
    workspace_path: "."
    remote_name: "origin"
    default_branch: "main"

team:
  executor:
    id: "claude-code"
    cli: "claude-code"
    adapter: "claude-hook"
  reviewers:
    - id: "codex"
      cli: "codex"
      adapter: "pty-wrapper"
      vote_weight: 1
    - id: "opencode"
      cli: "opencode"
      adapter: "pty-wrapper"
      vote_weight: 1
    - id: "antigravity"
      cli: "agy"
      adapter: "pty-wrapper"
      vote_weight: 1

policy:
  consensus_rule: "weighted_2/3_v1"
  dictator_cap_enabled: true
  minimum_winning_seats: 2
  seat_quorum_required: 2
  weight_quorum_required: 2
  max_rework_rounds: 3
  review_strategy: "delta_plus_focus"

merge:
  strategy: "ff_only"
  ci_gate_command: null
  require_human_signoff: true
  rebase_before_merge: false
