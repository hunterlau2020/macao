version: "2.5"
project:
  name: "dictator-violation"
  repository:
    workspace_path: "."
    remote_name: "origin"
    default_branch: "main"

team:
  executor:
    id: "dev"
    cli: "opencode"
    adapter: "pty-wrapper"
  reviewers:
    - id: "r1"
      cli: "codex"
      adapter: "pty-wrapper"
      vote_weight: 5
    - id: "r2"
      cli: "opencode"
      adapter: "pty-wrapper"
      vote_weight: 1
    - id: "r3"
      cli: "antigravity"
      adapter: "pty-wrapper"
      vote_weight: 1

policy:
  consensus_rule: "weighted_2/3_v1"
  dictator_cap_enabled: true
  minimum_winning_seats: 2
  seat_quorum_required: 2
  weight_quorum_required: 5
  max_rework_rounds: 3
  review_strategy: "delta_plus_focus"
