project:
  name: "macao-demo"
  repository:
    workspace_path: "."
    remote_name: "origin"
    default_branch: "main"

team:
  executor:
    id: "opencode-dev"
    cli: "opencode"
    adapter: "pty-wrapper"
    model: "GLM 5.3 max"
  reviewers:
    - id: "opencode"
      cli: "opencode"
      adapter: "pty-wrapper"
      model: "Qwen3.8 max"
    - id: "cursor"
      cli: "agent"
      adapter: "pty-wrapper"
      model: "claude-3-5-sonnet"
    - id: "antigravity"
      cli: "agy"
      adapter: "pty-wrapper"
      model: "gemini-2.0-pro"
    - id: "codex"
      cli: "codex"
      adapter: "pty-wrapper"
      model: "o3-mini"


policy:
  consensus_rule: "2/3_majority"
  min_effective_votes: 2
  max_rework_rounds: 3
  review_strategy: "delta_plus_focus"

merge:
  strategy: "ff_only"
  ci_gate_command: null
  require_human_signoff: true
  rebase_before_merge: false

timeouts:
  development: "2h"
  checkpoint_validation: "1m"
  review_request: "30m"
  per_reviewer: "10m"
  consensus_check: "1m"

thresholds:
  layer2_inference_log_only: true
  llm_diagnosis_override_below: 0.7

cost:
  usage_metering: true
  monthly_budget_usd: null

security:
  allowed_clis: ["claude-code", "codex", "opencode", "agy", "antigravity", "kimi"]
  send_terminal_logs_to_reviewers: false
  secrets_masking: true

audit:
  retention_days: 90
